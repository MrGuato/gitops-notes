# nginx server block for the gitops-notes container.
# Installed as /etc/nginx/conf.d/default.conf inside nginx-unprivileged,
# whose main nginx.conf already keeps the pid file and temp directories
# under /tmp, so the container runs with a read-only root filesystem.

# Cache lifetime by path. Astro writes hashed assets under /_astro/, which
# can be cached for a year. Everything else is revalidated often so a new
# post shows up without a purge. Cloudflare honours these at the edge once
# the hostname's cache rule is set to respect origin cache headers.
map $uri $cache_control {
    default                                          "public, max-age=300";
    ~^/_astro/                                       "public, max-age=31536000, immutable";
    ~*\.(?:png|jpe?g|gif|svg|webp|avif|ico|woff2?)$  "public, max-age=86400";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hide the nginx version and never list directories.
    server_tokens off;
    autoindex off;

    # cloudflared forwards the public Host header. Keep redirects relative
    # so nginx never writes its own port 8080 into a Location header.
    absolute_redirect off;
    port_in_redirect off;

    # A static site only answers GET and HEAD.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Security headers. Every add_header lives in this one block because
    # nginx drops inherited add_header lines as soon as a location adds its own.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $cache_control always;
    # No inline scripts: the theme script is served from /theme.js.
    # style-src keeps 'unsafe-inline' because Shiki puts inline style
    # attributes on highlighted code and Astro may inline small stylesheets.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # Probe endpoint for Kubernetes. Nothing to log.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Never serve dotfiles.
    location ~ /\. {
        return 404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Astro builds src/pages/404.astro into dist/404.html.
    error_page 404 /404.html;
}
